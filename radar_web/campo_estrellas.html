<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo de Estrellas Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a3a 50%, #0a0a2a 100%);
            min-height: 100vh;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .titulo {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Georgia', serif;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="estrellas"></canvas>
    <div class="titulo">Mueve el ratón para interactuar con las estrellas</div>

    <script>
        const canvas = document.getElementById('estrellas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetX = width / 2;
        let targetY = height / 2;

        class Estrella {
            constructor() {
                this.reset();
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.brightness = Math.random();
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.parallax = Math.random() * 0.5 + 0.1;
            }

            update() {
                // Parallax basado en el movimiento del ratón
                const dx = (mouseX - width / 2) * this.parallax * 0.01;
                const dy = (mouseY - height / 2) * this.parallax * 0.01;

                this.x += dx;
                this.y += dy;

                // Brillo parpadeante
                this.brightness = 0.5 + Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset) * 0.5;
                this.brightness = Math.max(0.2, Math.min(1, this.brightness));

                // Wrap around
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
                if (this.y < -10) this.y = height + 10;
                if (this.y > height + 10) this.y = -10;
            }

            draw() {
                const alpha = this.brightness * 0.8;
                const glow = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 3
                );
                glow.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                glow.addColorStop(0.5, `rgba(200, 220, 255, ${alpha * 0.5})`);
                glow.addColorStop(1, 'rgba(100, 150, 255, 0)');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                // Centro brillante
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }
        }

        class EstrellaFugaz {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.3;
                this.length = Math.random() * 50 + 30;
                this.speed = Math.random() * 15 + 10;
                this.opacity = 0;
                this.maxOpacity = Math.random() * 0.5 + 0.3;
                this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.opacity -= 0.02;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.opacity <= 0 || this.y > height) {
                    this.reset();
                    this.opacity = 0;
                }
            }

            draw() {
                if (this.opacity <= 0) return;

                const tailX = this.x - Math.cos(this.angle) * this.length;
                const tailY = this.y - Math.sin(this.angle) * this.length;

                const gradient = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
                gradient.addColorStop(0, `rgba(255, 255, 255, 0)`);
                gradient.addColorStop(1, `rgba(200, 230, 255, ${this.opacity})`);

                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Inicializar estrellas
        const estrellas = [];
        const numEstrellas = Math.min(300, Math.floor((width * height) / 8000));

        for (let i = 0; i < numEstrellas; i++) {
            estrellas.push(new Estrella());
        }

        // Estrellas fugaces
        const estrellasFugaces = [];
        const numFugaces = 3;

        for (let i = 0; i < numFugaces; i++) {
            const sf = new EstrellaFugaz();
            sf.opacity = 0;
            sf.nextSpawn = Math.random() * 5000 + 3000;
            estrellasFugaces.push(sf);
        }

        // Eventos del ratón
        canvas.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            targetX = e.touches[0].clientX;
            targetY = e.touches[0].clientY;
        }, { passive: false });

        // Resize
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Animación suave del ratón
        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }

        // Dibujar nebulosa de fondo
        function drawNebula() {
            const nebulaX = width / 2 + (mouseX - width / 2) * 0.02;
            const nebulaY = height / 2 + (mouseY - height / 2) * 0.02;

            const gradient = ctx.createRadialGradient(
                nebulaX, nebulaY, 0,
                nebulaX, nebulaY, Math.max(width, height) * 0.8
            );
            gradient.addColorStop(0, 'rgba(30, 20, 60, 0.3)');
            gradient.addColorStop(0.5, 'rgba(20, 10, 40, 0.2)');
            gradient.addColorStop(1, 'rgba(5, 5, 15, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        // Loop de animación
        function animate() {
            // Suavizar movimiento del ratón
            mouseX = lerp(mouseX, targetX, 0.05);
            mouseY = lerp(mouseY, targetY, 0.05);

            // Limpiar con fade suave
            ctx.fillStyle = 'rgba(10, 10, 26, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // Dibujar nebulosa
            drawNebula();

            // Dibujar estrellas
            estrellas.forEach(estrella => {
                estrella.update();
                estrella.draw();
            });

            // Gestionar estrellas fugaces
            estrellasFugaces.forEach(sf => {
                if (sf.opacity <= 0) {
                    sf.nextSpawn -= 16;
                    if (sf.nextSpawn <= 0) {
                        sf.opacity = sf.maxOpacity;
                        sf.nextSpawn = Math.random() * 5000 + 3000;
                    }
                }
                sf.update();
                sf.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
